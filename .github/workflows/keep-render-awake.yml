name: Keep Render service awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 https://quiz-english-bot-wprc.onrender.com/
